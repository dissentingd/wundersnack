name: Refresh feed

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new Commons videos to convert and upload this run"
        default: "60"

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build feed.json
        run: node scripts/build-feed.mjs
      - name: Install ffmpeg
        if: ${{ env.R2_ACCOUNT_ID != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cache Commons videos as H.264 (uploads only when R2 secrets are set)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then
            node scripts/cache-media.mjs --upload --limit=${{ github.event.inputs.limit || '60' }}
          else
            node scripts/cache-media.mjs
          fi
      - name: Commit feed.json if it changed
        run: |
          if git diff --quiet -- feed.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Refresh feed"
          git push
